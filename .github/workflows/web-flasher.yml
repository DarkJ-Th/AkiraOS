# SPDX-License-Identifier: Apache-2.0
#
# AkiraOS Web Flasher (ESP32-S3 DevKitM N16R8)
# บิลด์ MCUboot + AkiraOS บน GitHub Actions แล้วเผยแพร่เป็นหน้าเว็บ flasher บน GitHub Pages
# ผู้ใช้เปิดหน้าเว็บด้วย Chrome/Edge เสียบ USB แล้วกด Flash ได้เลย ไม่ต้องมี Linux/WSL/west
#
# วางไฟล์นี้ที่ .github/workflows/web-flasher.yml ใน repo AkiraOS (fork ของคุณ)
# และวาง web/index.html ไว้ที่ web/index.html
# ตั้งค่า: Settings -> Pages -> Source = "GitHub Actions"
name: web-flasher

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZEPHYR_BOARD: esp32s3_devkitm/esp32s3/procpu
  BOARD_ID: esp32s3_devkitm_esp32s3_procpu
  ZEPHYR_TOOLCHAIN_VARIANT: zephyr
  ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-0.17.4
  # ออฟเซ็ตตาม build.sh: MCUboot 0x0, แอป 0x20000 (= 131072)
  APP_OFFSET: "131072"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.6@sha256:427a55fe95911ea97aa99fa0aedce95cb5550cbdd74f3525d23e35b2221f2335
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          path: akira-os
          submodules: recursive

      - name: West workspace
        working-directory: akira-os
        run: |
          west init -l .
          west update
          west zephyr-export

      - name: Zephyr SDK (xtensa esp32s3) ถ้ายังไม่มีใน image
        run: |
          if [ ! -f "$ZEPHYR_SDK_INSTALL_DIR/sdk_version" ]; then
            mkdir -p /opt/toolchains
            wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/zephyr-sdk-0.17.4_linux-x86_64.tar.xz
            tar xf zephyr-sdk-0.17.4_linux-x86_64.tar.xz -C /opt/toolchains
            (cd "$ZEPHYR_SDK_INSTALL_DIR" && ./setup.sh -t xtensa-espressif_esp32s3_zephyr-elf -h -c)
          fi

      - name: Fetch Espressif HAL blobs
        working-directory: akira-os
        run: west blobs fetch hal_espressif

      # เลียนแบบ build_mcuboot() ใน build.sh
      - name: Build MCUboot
        run: |
          ROOT="$GITHUB_WORKSPACE/akira-os"
          west build --pristine -b "$ZEPHYR_BOARD" bootloader/mcuboot/boot/zephyr -d build-mcuboot -- \
            -DBOARD_ROOT="$ROOT" -DDTS_ROOT="$ROOT" \
            -DEXTRA_DTC_OVERLAY_FILE="$ROOT/snippets/akira-board/boards/${BOARD_ID}.overlay" \
            -DEXTRA_CONF_FILE="$ROOT/boards/mcuboot-swap-move.conf"

      # เลียนแบบ build_application() ใน build.sh
      - name: Build AkiraOS
        run: |
          west build --pristine -b "$ZEPHYR_BOARD" akira-os -d build-app

      - name: Assemble web flasher
        run: |
          mkdir -p site
          cp build-mcuboot/zephyr/zephyr.bin site/bootloader.bin
          APP=build-app/zephyr/zephyr.signed.bin
          [ -f "$APP" ] || APP=build-app/zephyr/zephyr.bin
          cp "$APP" site/akiraos.bin
          cp akira-os/web/index.html site/index.html

          major=$(sed -n 's/^VERSION_MAJOR *= *//p' akira-os/VERSION | tr -d ' ')
          minor=$(sed -n 's/^VERSION_MINOR *= *//p' akira-os/VERSION | tr -d ' ')
          patch=$(sed -n 's/^PATCHLEVEL *= *//p' akira-os/VERSION | tr -d ' ')
          VER="${major}.${minor}.${patch}"

          cat > site/manifest.json <<JSON
          {
            "name": "AkiraOS ESP32-S3 DevKitM N16R8",
            "version": "${VER}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "akiraos.bin", "offset": ${APP_OFFSET} }
                ]
              }
            ]
          }
          JSON
          python3 -m json.tool site/manifest.json > /dev/null

          (cd site && sha256sum bootloader.bin akiraos.bin > SHA256SUMS)
          echo "== ขนาดไฟล์ =="; ls -l site
          echo "== หน่วยความจำ =="; size build-app/zephyr/zephyr.elf || true

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
